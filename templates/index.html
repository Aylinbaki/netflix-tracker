<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Netflix Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              netflix: "#E50914",
            },
          },
        },
      };
    </script>
  </head>
  <body class="min-h-screen bg-zinc-950 text-zinc-100">
    <div class="mx-auto max-w-4xl px-4 py-10">
      <header class="mb-8">
        <p class="text-sm font-semibold uppercase tracking-[0.2em] text-netflix">
          Netflix Tracker
        </p>
        <h1 class="mt-2 text-3xl font-bold">İzleme listenizi yönetin</h1>
        <p class="mt-2 text-zinc-400">
          Film veya dizi ekleyin, durumunu takip edin ve puanlayın.
        </p>
      </header>

      <form
        id="add-form"
        class="mb-8 grid gap-4 rounded-2xl border border-zinc-800 bg-zinc-900 p-6"
      >
        <div class="grid gap-4 md:grid-cols-2">
          <label class="block">
            <span class="mb-1 block text-sm text-zinc-300">Başlık</span>
            <input
              id="title"
              name="title"
              type="text"
              required
              placeholder="Örn. Stranger Things"
              class="w-full rounded-lg border border-zinc-700 bg-zinc-950 px-3 py-2 outline-none focus:border-netflix"
            />
          </label>
          <label class="block">
            <span class="mb-1 block text-sm text-zinc-300">Durum</span>
            <select
              id="status"
              name="status"
              class="w-full rounded-lg border border-zinc-700 bg-zinc-950 px-3 py-2 outline-none focus:border-netflix"
            >
              <option value="watchlist">İzleme listesi</option>
              <option value="watching">İzleniyor</option>
              <option value="completed">Tamamlandı</option>
            </select>
          </label>
          <label class="block">
            <span class="mb-1 block text-sm text-zinc-300">Puan (1-10)</span>
            <input
              id="rating"
              name="rating"
              type="number"
              min="1"
              max="10"
              placeholder="Opsiyonel"
              class="w-full rounded-lg border border-zinc-700 bg-zinc-950 px-3 py-2 outline-none focus:border-netflix"
            />
          </label>
          <label class="block">
            <span class="mb-1 block text-sm text-zinc-300">Not</span>
            <input
              id="notes"
              name="notes"
              type="text"
              placeholder="Kısa bir not"
              class="w-full rounded-lg border border-zinc-700 bg-zinc-950 px-3 py-2 outline-none focus:border-netflix"
            />
          </label>
        </div>
        <button
          type="submit"
          class="rounded-lg bg-netflix px-4 py-2 font-semibold text-white hover:bg-red-600"
        >
          Listeye ekle
        </button>
        <p id="message" class="text-sm text-zinc-400"></p>
      </form>

      <section>
        <h2 class="mb-4 text-xl font-semibold">Kayıtlı başlıklar</h2>
        <div id="titles" class="grid gap-3"></div>
      </section>
    </div>

    <script>
      const form = document.getElementById("add-form");
      const titlesEl = document.getElementById("titles");
      const messageEl = document.getElementById("message");

      const statusLabels = {
        watchlist: "İzleme listesi",
        watching: "İzleniyor",
        completed: "Tamamlandı",
      };

      async function loadTitles() {
        const response = await fetch("/api/titles");
        const titles = await response.json();

        if (!titles.length) {
          titlesEl.innerHTML =
            '<p class="rounded-xl border border-dashed border-zinc-800 p-6 text-zinc-500">Henüz kayıt yok.</p>';
          return;
        }

        titlesEl.innerHTML = titles
          .map(
            (item) => `
            <article class="rounded-xl border border-zinc-800 bg-zinc-900 p-4">
              <div class="flex items-start justify-between gap-4">
                <div>
                  <h3 class="text-lg font-semibold">${item.title}</h3>
                  <p class="text-sm text-zinc-400">
                    ${statusLabels[item.status] || item.status}${
                      item.season && item.episode
                        ? ` · S${item.season}:E${item.episode}`
                        : ""
                    }
                  </p>
                </div>
                <span class="rounded-full bg-zinc-800 px-3 py-1 text-sm">
                  ${item.rating ? item.rating + "/10" : "Puansız"}
                </span>
              </div>
              ${item.notes ? `<p class="mt-2 text-sm text-zinc-300">${item.notes}</p>` : ""}
            </article>
          `
          )
          .join("");
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        messageEl.textContent = "";

        const payload = {
          title: document.getElementById("title").value,
          status: document.getElementById("status").value,
          rating: document.getElementById("rating").value,
          notes: document.getElementById("notes").value,
        };

        const response = await fetch("/api/add", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });

        const data = await response.json();
        if (!response.ok) {
          messageEl.textContent = data.error || "Kayıt eklenemedi.";
          return;
        }

        form.reset();
        messageEl.textContent = "Başlık eklendi.";
        await loadTitles();
      });

      loadTitles();
    </script>
  </body>
</html>
