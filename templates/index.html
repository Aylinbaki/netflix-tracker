<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Netflix Tracker</title>
    <!-- Font Awesome İkonları -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              netflix: "#E50914",
            },
          },
        },
      };
    </script>
    <style>
      .glass-card {
        background: rgba(24, 24, 27, 0.6);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      .glass-card:hover {
        border-color: rgba(229, 9, 20, 0.4);
        box-shadow: 0 8px 24px rgba(229, 9, 20, 0.15);
      }
      .star-rating i {
        cursor: pointer;
        transition: color 0.15s ease;
      }
    </style>
  </head>
  <body class="min-h-screen bg-[#141414] text-zinc-100 font-sans antialiased">
    <div class="mx-auto max-w-5xl px-4 py-8">
      
      <!-- Navbar / Header -->
      <header class="mb-8 flex items-center justify-between border-b border-zinc-800/80 pb-5">
        <div>
          <p class="text-xs font-bold uppercase tracking-[0.25em] text-netflix">
            Automated Tracking
          </p>
          <h1 class="mt-1 text-3xl font-black tracking-tight">
            <span class="text-netflix">NETFLIX</span> TRACKER
          </h1>
        </div>
        <div class="flex items-center gap-2 rounded-full border border-zinc-800 bg-zinc-900/80 px-4 py-1.5 text-xs text-zinc-400">
          <span class="relative flex h-2 w-2">
            <span class="absolute inline-flex h-full w-full animate-ping rounded-full bg-emerald-400 opacity-75"></span>
            <span class="relative inline-flex h-2 w-2 rounded-full bg-emerald-500"></span>
          </span>
          Eklenti Aktif
        </div>
      </header>

      <!-- Özet İstatistik Kartları -->
      <section class="mb-8 grid grid-cols-1 gap-4 sm:grid-cols-3">
        <div class="glass-card flex items-center gap-4 rounded-2xl p-5 transition-all duration-300">
          <div class="flex h-12 w-12 items-center justify-center rounded-xl bg-netflix/10 text-netflix">
            <i class="fa-solid fa-film text-xl"></i>
          </div>
          <div>
            <p class="text-2xl font-bold tracking-tight" id="stat-total-shows">0</p>
            <p class="text-xs font-medium text-zinc-400">Toplam Başlık</p>
          </div>
        </div>

        <div class="glass-card flex items-center gap-4 rounded-2xl p-5 transition-all duration-300">
          <div class="flex h-12 w-12 items-center justify-center rounded-xl bg-netflix/10 text-netflix">
            <i class="fa-solid fa-tv text-xl"></i>
          </div>
          <div>
            <p class="text-2xl font-bold tracking-tight" id="stat-total-episodes">0</p>
            <p class="text-xs font-medium text-zinc-400">İzlenen Bölüm Sayısı</p>
          </div>
        </div>

        <div class="glass-card flex items-center gap-4 rounded-2xl p-5 transition-all duration-300">
          <div class="flex h-12 w-12 items-center justify-center rounded-xl bg-netflix/10 text-netflix">
            <i class="fa-solid fa-clock text-xl"></i>
          </div>
          <div>
            <p class="text-2xl font-bold tracking-tight" id="stat-last-activity">-</p>
            <p class="text-xs font-medium text-zinc-400">Son İzleme </p>
          </div>
        </div>
      </section>

      <!-- Filtre Butonları ve Başlık -->
      <section class="mb-5 flex flex-wrap items-center justify-between gap-4">
        <h2 class="text-xl font-bold tracking-tight">Son İzlenen İçerikler</h2>
        
        <div class="flex items-center gap-2 rounded-xl bg-zinc-900 p-1 border border-zinc-800 text-xs font-medium">
          <button onclick="filterTitles('all')" id="filter-all" class="filter-btn active rounded-lg px-3 py-1.5 bg-netflix text-white transition-all">
            Tümü
          </button>
          <button onclick="filterTitles('series')" id="filter-series" class="filter-btn rounded-lg px-3 py-1.5 text-zinc-400 hover:text-white transition-all">
            <i class="fa-solid fa-tv mr-1"></i> Diziler
          </button>
          <button onclick="filterTitles('movies')" id="filter-movies" class="filter-btn rounded-lg px-3 py-1.5 text-zinc-400 hover:text-white transition-all">
            <i class="fa-solid fa-clapperboard mr-1"></i> Filmler (>1:30 Sa)
          </button>
        </div>
      </section>

      <!-- İçerik Grid Yapısı -->
      <section>
        <div id="titles" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3"></div>
      </section>

    </div>

    <script>
      let allTitlesData = [];
      let currentFilter = "all";

      const titlesEl = document.getElementById("titles");
      const statTotalShows = document.getElementById("stat-total-shows");
      const statTotalEpisodes = document.getElementById("stat-total-episodes");
      const statLastActivity = document.getElementById("stat-last-activity");

      // Dizi / Film Ayrımı Mantığı (Yalnızca süresi açıkça 90 dk üstü olanlar filmdir)
      function isMovie(item) {
        if (item.duration_minutes && item.duration_minutes >= 90) return true;
        return false;
      }

      // Yıldız Puanı Güncelleme (1-5 Yıldız)
      async function rateTitle(id, rating) {
        try {
          const response = await fetch(`/api/rate/${id}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ rating: rating }),
          });

          if (response.ok) {
            const titleObj = allTitlesData.find((t) => t.id === id);
            if (titleObj) titleObj.rating = rating;
            renderTitles();
          }
        } catch (err) {
          console.error("Puanlama hatası:", err);
        }
      }

      // Kayıt Silme
      async function deleteTitle(id) {
        if (!confirm("Bu kaydı silmek istediğinize emin misiniz?")) return;
        try {
          const response = await fetch(`/api/delete/${id}`, { method: "DELETE" });
          if (response.ok) {
            await loadTitles();
          }
        } catch (err) {
          console.error("Silme hatası:", err);
        }
      }

      // Filtre Değiştirme
      function filterTitles(type) {
        currentFilter = type;
        document.querySelectorAll(".filter-btn").forEach((btn) => {
          btn.classList.remove("bg-netflix", "text-white");
          btn.classList.add("text-zinc-400");
        });
        const activeBtn = document.getElementById(`filter-${type}`);
        activeBtn.classList.add("bg-netflix", "text-white");
        activeBtn.classList.remove("text-zinc-400");
        renderTitles();
      }

      // Kartları Ekrana Basma
      function renderTitles() {
        let filtered = allTitlesData;
        if (currentFilter === "series") {
          filtered = allTitlesData.filter((item) => !isMovie(item));
        } else if (currentFilter === "movies") {
          filtered = allTitlesData.filter((item) => isMovie(item));
        }

        if (!filtered.length) {
          titlesEl.innerHTML = `
            <div class="col-span-full rounded-2xl border border-dashed border-zinc-800/80 p-12 text-center">
              <i class="fa-solid fa-film mb-3 text-3xl text-zinc-600"></i>
              <p class="text-sm font-medium text-zinc-400">Bu filtrede gösterilecek içerik bulunamadı.</p>
            </div>
          `;
          return;
        }

        titlesEl.innerHTML = filtered
          .map((item) => {
            const movieFlag = isMovie(item);
            const currentRating = item.rating || 0;

            // 1-5 Yıldız HTML
            let starsHtml = `<div class="star-rating flex items-center gap-1 text-zinc-600">`;
            for (let i = 1; i <= 5; i++) {
              const activeClass = i <= currentRating ? "text-amber-400" : "hover:text-amber-200";
              starsHtml += `<i class="fa-solid fa-star text-xs ${activeClass}" onclick="rateTitle(${item.id}, ${i})"></i>`;
            }
            starsHtml += `</div>`;

            // Sezon / Bölüm Etiketi Hazırlama
            let epLabel = "";
            if (item.season || item.episode) {
              epLabel = `${item.season ? `S${item.season}` : ""}${item.season && item.episode ? " : " : ""}${item.episode ? `E${item.episode}` : ""}`;
            } else if (item.notes && (item.notes.includes("Episode") || item.notes.includes("Bölüm"))) {
              epLabel = item.notes; // Eğer notlar içinde bölüm bilgisi varsa göster
            }

            return `
              <article class="glass-card relative flex flex-col justify-between rounded-2xl p-5 transition-all duration-300">
                <div>
                  <!-- Üst Kısım: Başlık ve Yıldızlar -->
                  <div class="flex items-start justify-between gap-2">
                    <h3 class="font-bold text-zinc-100 text-base leading-snug">${item.title}</h3>
                    ${starsHtml}
                  </div>

                  <!-- Rozetler -->
                  <div class="mt-3 flex flex-wrap items-center gap-1.5">
                    <span class="rounded-md bg-zinc-800/80 px-2 py-0.5 text-[11px] font-medium text-zinc-300 border border-zinc-700/40">
                      ${movieFlag ? '<i class="fa-solid fa-clapperboard text-netflix mr-1"></i>Film' : '<i class="fa-solid fa-tv text-netflix mr-1"></i>Dizi'}
                    </span>
                    
                    ${
                      epLabel
                        ? `<span class="rounded-md bg-netflix/10 px-2 py-0.5 text-[11px] font-semibold text-netflix border border-netflix/20">
                            ${epLabel}
                           </span>`
                        : `<span class="rounded-md bg-zinc-800/50 px-2 py-0.5 text-[11px] text-zinc-400">
                            Bölüm İzlendi
                           </span>`
                    }
                  </div>
                </div>

                <!-- Alt Kısım: Tarih ve Sil -->
                <div class="mt-5 flex items-center justify-between border-t border-zinc-800/60 pt-3">
                  <span class="text-[11px] text-zinc-500">
                    <i class="fa-regular fa-calendar mr-1"></i>
                    ${item.created_at ? new Date(item.created_at).toLocaleDateString("tr-TR") : "Bilinmiyor"}
                  </span>
                  <button
                    onclick="deleteTitle(${item.id})"
                    class="flex items-center gap-1.5 rounded-lg px-2.5 py-1 text-xs font-medium text-zinc-400 hover:bg-netflix/15 hover:text-netflix transition-colors duration-200"
                  >
                    <i class="fa-solid fa-trash-can text-xs"></i>
                    <span>Sil</span>
                  </button>
                </div>
              </article>
            `;
          })
          .join("");
      }

      // Verileri Çekme ve Hesaplama
      async function loadTitles() {
        try {
          const response = await fetch("/api/titles");
          allTitlesData = await response.json();

          // 1. BENZERSİZ BAŞLIK SAYISI (100 Days of Deception kaç bölüm olursa olsun 1 sayılır)
          const uniqueTitles = new Set(allTitlesData.map((t) => t.title.trim().toLowerCase()));
          statTotalShows.textContent = uniqueTitles.size;

          // 2. İZLENEN BÖLÜM SAYISI (Veritabanındaki toplam satır)
          statTotalEpisodes.textContent = allTitlesData.length;

          // 3. SON İZLEME AKTİVİTESİ
          if (allTitlesData.length > 0 && allTitlesData[0].created_at) {
            const date = new Date(allTitlesData[0].created_at);
            statLastActivity.textContent = date.toLocaleDateString("tr-TR", {
              day: "numeric",
              month: "short",
            });
          } else {
            statLastActivity.textContent = "Henüz Yok";
          }

          renderTitles();
        } catch (err) {
          console.error("Veriler çekilemedi:", err);
        }
      }

      loadTitles();
    </script>
  </body>
</html>
